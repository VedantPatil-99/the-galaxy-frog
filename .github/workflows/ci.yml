name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  PYTHON_VERSION: 3.14.7
  UV_VERSION: 0.12.7

jobs:
  contracts:
    name: Generated API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Install locked dependencies
        run: |
          bun ci
          uv sync --directory backend --locked --python "${PYTHON_VERSION}"

      - name: Reject stale generated contracts
        run: bun run contracts:check

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: galaxy_frog_ci
          POSTGRES_USER: galaxy_frog_ci
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galaxy_frog_ci -d galaxy_frog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials, used only by this isolated CI database.
      DATABASE_URL: postgresql+asyncpg://galaxy_frog_ci:ci_test_password@127.0.0.1:5432/galaxy_frog_ci
      RUN_DATABASE_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Install locked dependencies
        run: uv sync --directory backend --locked --python "${PYTHON_VERSION}"

      - name: Lint
        run: uv run --directory backend ruff check .

      - name: Check formatting
        run: uv run --directory backend ruff format --check .

      - name: Type-check
        run: uv run --directory backend python -m pyright

      - name: Apply database migrations
        run: uv run --directory backend python -m alembic upgrade head

      - name: Test
        run: uv run --directory backend python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun ci

      - name: Lint
        run: bun run lint:web

      - name: Type-check
        run: bun run typecheck:web

      - name: Test
        run: bun run test:web

      - name: Build
        run: bun run build

      - name: Verify two-tab account isolation
        run: bun scripts/workspace-account-isolation.ts
